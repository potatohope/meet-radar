# Serverless Devs 项目配置（阿里云函数计算 FC 3.0）
# 用法：
#   1. 安装 Serverless Devs：npm i @serverless-devs/s -g
#   2. 配置阿里云凭据：s config add  （需 AccessKey ID / Secret）
#   3. 部署：s deploy
#
# 环境变量 DASHSCOPE_API_KEY 请在部署后于控制台配置，或使用下方 env 字段（不建议提交到仓库）。
edition: 3.0.0
name: pet-radar
access: "default"

vars:
  region: "cn-hangzhou"
  functionName: "pet-radar-api"

resources:
  pet_radar_api:
    component: fc3
    props:
      region: ${vars.region}
      functionName: ${vars.functionName}
      runtime: python3.10
      handler: main.handler
      code: .
      timeout: 60
      memorySize: 512
      environmentVariables:
        MODEL: "qwen3-vl-plus"
        # 部署后请务必在阿里云控制台填入真实值，不要提交明文 Key
        DASHSCOPE_API_KEY: "YOUR_DASHSCOPE_API_KEY"
      triggers:
        - triggerName: http
          triggerType: http
          triggerConfig:
            authType: anonymous
            methods:
              - GET
              - POST
              - OPTIONS
            disableURLInternet: false
